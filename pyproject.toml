[project]
name = "recosys"
version = "0.1.0"
description = "Hybrid movie recommender with cohort-affinity weighting for Nepali male IT students"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.3",
    "jinja2>=3.1.6",
    "joblib>=1.4.0",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.0",
    "scikit-surprise>=1.1.5",
    "scipy>=1.14.0",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.14.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = [".", "./src"]
include = ["src", "engine", "evaluation", "api", "tests", "main.py"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    ".venv",
    "archive",
    "notebooks",
    "data",
    "results",
]

useLibraryCodeForTypes = false
reportMissingImports = "warning"
reportMissingTypeStubs = false
reportPrivateImportUsage = false

[tool.ruff]
target-version = "py312"
exclude = [".venv", "archive", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
